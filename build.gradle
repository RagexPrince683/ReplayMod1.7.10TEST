import com.replaymod.gradle.preprocess.PreprocessTask
import net.minecraftforge.gradle.delayed.DelayedFile
import net.minecraftforge.gradle.tasks.user.SingleDeobfTask
import java.util.jar.JarFile

buildscript {
    repositories {
        maven {
            url = "https://plugins.gradle.org/m2/"
        }
        mavenCentral()
        maven {
            name = "forge"
            url = "https://files.minecraftforge.net/maven"
        }
        maven {
            name = "sonatype"
            url = "https://oss.sonatype.org/content/repositories/snapshots/"
        }
        maven { url 'https://jitpack.io' }
    }

    dependencies {
        classpath 'com.github.jengelman.gradle.plugins:shadow:4.0.2'
        classpath 'com.github.ReplayMod:ForgeGradle:5fca6853:all' // FG 1.2 for Forge 1.7.10
    }
}

def mcVersion = 10710
def mcVersionStr = '1.7.10'
def jGui = project.evaluationDependsOn(':jGui:1.7.10')

apply plugin: 'com.github.johnrengelman.shadow'

apply plugin: 'forge'

ext {
    mixinSrg = new File(project.buildDir, 'tmp/mixins/mixins.srg')
    mixinRefMap = new File(project.buildDir, 'tmp/mixins/mixins.replaymod.refmap.json')
}

compileJava {
    options.compilerArgs += [
            "-AoutSrgFile=${project.mixinSrg.canonicalPath}",
            "-AoutRefMapFile=${project.mixinRefMap.canonicalPath}",
            "-AreobfSrgFile=${project.file('build/mcp-srg.srg').canonicalPath}"
    ]
}

apply plugin: 'com.replaymod.preprocess'

preprocess {
    vars.put("MC", mcVersion)
    vars.put("FABRIC", 0)

    keywords.set([
            ".java": PreprocessTask.DEFAULT_KEYWORDS,
            ".json": PreprocessTask.DEFAULT_KEYWORDS,
            ".mcmeta": PreprocessTask.DEFAULT_KEYWORDS,
            ".cfg": PreprocessTask.CFG_KEYWORDS,
            ".vert": PreprocessTask.DEFAULT_KEYWORDS,
            ".frag": PreprocessTask.DEFAULT_KEYWORDS,
    ])
}

sourceCompatibility = 1.8
targetCompatibility = 1.8

version = project.name + '-' + rootProject.version
group= "com.replaymod"
archivesBaseName = "replaymod"

minecraft {
    runDir = "../../run"
    version = '1.7.10-10.13.4.1558-1.7.10'
    mappings = 'stable_12'
}

afterEvaluate {
        // ForgeGradle 1.2 still uses the removed Minecraft.Download S3 endpoints.
        // These URLs and hashes come from Mojang's 1.7.10 version manifest.
        tasks.getVersionJson.url = 'https://piston-meta.mojang.com/v1/packages/ed5d8789ed29872ea2ef1c348302b0c55e3f3468/1.7.10.json'
        tasks.getAssetsIndex.url = 'https://launchermeta.mojang.com/v1/packages/1863782e33ce7b584fc45b037325a1964e095d3e/1.7.10.json'
        def delayedString = tasks.downloadClient.class.classLoader.loadClass('net.minecraftforge.gradle.delayed.DelayedString')
        tasks.downloadClient.url = delayedString.newInstance(project, 'https://launcher.mojang.com/v1/objects/e80d9b3bf5085002218d4be59e668bac718abbc6/client.jar')
        tasks.downloadServer.url = delayedString.newInstance(project, 'https://launcher.mojang.com/v1/objects/952438ac4e01b4d115c5fc38f891710c4941df29/server.jar')
        tasks.downloadMcpTools.mcpUrl = delayedString.newInstance(project, 'https://files.minecraftforge.net/fernflower-fix-1.0.zip')
        tasks.downloadMcpTools.outputs.file(tasks.downloadMcpTools.ffJar)
    // ForgeGradle has already forwarded minecraft.replace to the task by now.
    tasks.sourceMainJava.replace '@MOD_VERSION@', project.version
    tasks.sourceMainJava.replace '@MC_VERSION@', "[ $mcVersionStr ]"
}

repositories {
    maven {
        name = "SpongePowered Repo"
        url = "https://repo.spongepowered.org/maven/"
    }
    maven {
        url 'https://jitpack.io'
        content {
            includeGroupByRegex 'com\\.github\\..*'
        }
    }
}

configurations {
    // Include dep in fat jar without relocation and, when forge supports it, without exploding (TODO)
    shade
    compile.extendsFrom shade
    // Include dep in fat jar with relocation and minimization
    shadow
    compile.extendsFrom shadow
}

def shadeExclusions = {
    // Cannot just add these to the shade configuration because they'd be inherited by the compile configuration then
    exclude group: 'com.google.guava', module: 'guava-jdk5'
    exclude group: 'com.google.guava', module: 'guava' // provided by MC
    exclude group: 'com.google.code.gson', module: 'gson' // provided by MC
}

dependencies {
    def mixinVersion = '0.7.11-SNAPSHOT'
    annotationProcessor "org.spongepowered:mixin:$mixinVersion"
    compileOnly "org.spongepowered:mixin:$mixinVersion"
    shade("org.spongepowered:mixin:$mixinVersion") {
        transitive = false // deps should all be bundled with MC
    }
    annotationProcessor 'com.google.code.gson:gson:2.2.4'
    annotationProcessor 'com.google.guava:guava:21.0'
    annotationProcessor 'org.ow2.asm:asm-tree:6.2'
    annotationProcessor 'org.apache.logging.log4j:log4j-core:2.0-beta9'
    shadow 'com.googlecode.mp4parser:isoparser:1.1.7'
    shadow 'org.apache.commons:commons-exec:1.3'
    shadow 'com.google.apis:google-api-services-youtube:v3-rev178-1.22.0', shadeExclusions
    shadow 'com.google.api-client:google-api-client-gson:1.20.0', shadeExclusions
    shadow 'com.google.api-client:google-api-client-java6:1.20.0', shadeExclusions
    shadow 'com.google.oauth-client:google-oauth-client-jetty:1.20.0'

    shadow 'com.github.javagl.JglTF:jgltf-model:3af6de4'

    shadow 'org.aspectj:aspectjrt:1.8.2'

    shadow 'com.github.ReplayMod.JavaBlend:2.79.0:a0696f8'

    shadow "com.github.ReplayMod:ReplayStudio:a1f82a7", shadeExclusions

    implementation(jGui){
        transitive = false // FG 1.2 puts all MC deps into the compile configuration and we don't want to shade those
    }
    shadow 'com.github.ReplayMod:lwjgl-utils:27dcd66'

    testCompile 'junit:junit:4.11'
}

// FG 1.2 adds all MC deps to the compile configuration, which we do not shade.
afterEvaluate {
    configurations.compile.extendsFrom -= [configurations.minecraft, configurations.minecraftDeps]
    configurations.runtime.extendsFrom -= [configurations.forgeGradleStartClass]
    sourceSets.main.with {
        compileClasspath += configurations.minecraft + configurations.minecraftDeps
        runtimeClasspath += configurations.minecraft + configurations.minecraftDeps + configurations.forgeGradleStartClass
    }
    // FG 1.2 adds these configurations as runtime dependencies, but Gradle 5.4.1
    // does not put their files on the JavaExec classpath. Keep the bridge on
    // Forge's launch tasks so the generated start classes stay out of the mod jar.
    ['runClient', 'runServer', 'debugClient', 'debugServer'].each { name ->
        def launch = tasks.getByName(name)
        launch.classpath configurations.minecraft, configurations.minecraftDeps,
                configurations.forgeGradleStartClass, files(jGui.tasks.jar.archivePath)
        launch.dependsOn tasks.makeStart, jGui.tasks.jar
    }
    // ForgeGradle puts the raw jar on the classpath, but Forge 1.7.10 skips
    // classpath coremods during ordinary mod discovery. Supply the current
    // compiled mod through Forge's --mods development argument instead.
    def client = tasks.runClient
    client.classpath = files(jGui.sourceSets.main.output, tasks.devJar.archivePath) +
            (client.classpath - files(tasks.jar.archivePath))
    client.dependsOn tasks.devJar, jGui.tasks.classes
    // The core plugin and tweaker must be registered before mod discovery.
    // Keep the dev jar's manifest free of coremod entries so ForgeGradle does
    // not inject a second copy of the plugin from the classpath.
    client.jvmArgs '-Dfml.coreMods.load=com.replaymod.core.LoadingPlugin'
    client.args '--tweakClass', 'com.replaymod.core.tweaker.ReplayModTweaker'
    def runDirectory = project.file(minecraft.runDir).canonicalFile
    def devModsDirectory = rootProject.file('devmods')
    def localModJars = devModsDirectory.isDirectory() ? devModsDirectory.listFiles()
            .findAll { it.isFile() && it.name.endsWith('.jar') }.sort { it.name } : []
    // Identify the provider by its core plugin and embedded Mixin classes,
    // rather than depending on the filename or Forge's later --mods scan.
    def isUniMixinsProvider = { File modJar ->
        def jar = new JarFile(modJar)
        try {
            jar.manifest?.mainAttributes?.getValue('FMLCorePlugin') ==
                    'io.github.legacymoddingmc.unimixins.all.AllCore' &&
                    jar.getEntry('org/spongepowered/asm/launch/MixinBootstrap.class') != null
        } finally {
            jar.close()
        }
    }
    def mixinProviders = localModJars.findAll(isUniMixinsProvider)
    if (mixinProviders.size() > 1) {
        throw new GradleException('Only one UniMixins runtime may be supplied in devmods')
    }
    def mixinProvider = mixinProviders ? mixinProviders.first() : null
    def hasMcheliInventoryAliases = { File modJar ->
        def jar = new JarFile(modJar)
        try {
            jar.manifest?.mainAttributes?.getValue('FMLCorePlugin') == 'mcheli.core.MCH_CorePlugin' &&
                    jar.getEntry('mcheli/wrapper/W_EntityContainer.class') != null
        } finally {
            jar.close()
        }
    }
    // Forge release jars may have SRG member names even when their Minecraft
    // class names are already deobfuscated. notchToMcp does not rename those.
    def hasSrgMinecraftMembers = { File modJar ->
        def jar = new JarFile(modJar)
        try {
            jar.entries().find { entry ->
                if (!entry.name.endsWith('.class')) return false
                def stream = jar.getInputStream(entry)
                try {
                    def contents = new String(stream.bytes, 'ISO-8859-1')
                    contents.contains('net/minecraft/') &&
                            (contents =~ /(?:func|field)_\d+/).find()
                } finally {
                    stream.close()
                }
            } != null
        } finally {
            jar.close()
        }
    }
    def remappedModsDirectory = file("$buildDir/generated-devmods")
    def remapIndex = 0
    def mixinProviderOutput = null
    def remappedModJars = localModJars.collect { modJar ->
        def index = remapIndex++
        def output = new File(remappedModsDirectory, modJar.name + '.deobf.jar')
        def mapping = hasSrgMinecraftMembers(modJar) ? tasks.genSrgs.srgToMcp : tasks.genSrgs.notchToMcp
        def mappingTask = null
        if (hasMcheliInventoryAliases(modJar)) {
            def baseMapping = mapping
            def adjustedMapping = file("$buildDir/tmp/devmods/mcheli-inventory-aliases-${index}.srg")
            def aliases = '\nMD: mcheli/wrapper/W_EntityContainer/func_70295_k_ ()V mcheli/wrapper/W_EntityContainer/func_70295_k_ ()V' +
                    '\nMD: mcheli/wrapper/W_EntityContainer/func_70305_f ()V mcheli/wrapper/W_EntityContainer/func_70305_f ()V' +
                    '\nMD: mcheli/aircraft/MCH_BaseVehicleInventory/func_70295_k_ ()V mcheli/aircraft/MCH_BaseVehicleInventory/func_70295_k_ ()V' +
                    '\nMD: mcheli/aircraft/MCH_BaseVehicleInventory/func_70305_f ()V mcheli/aircraft/MCH_BaseVehicleInventory/func_70305_f ()V' +
                    '\nMD: mcheli/mob/MCH_EntityGunner/func_70035_c ()[Lnet/minecraft/item/ItemStack; mcheli/mob/MCH_EntityGunner/func_70035_c ()[Lnet/minecraft/item/ItemStack;\n'
            mappingTask = tasks.create("prepareDevModMappings${index}") {
                dependsOn tasks.genSrgs
                inputs.file(baseMapping)
                inputs.property('aliases', aliases)
                outputs.file(adjustedMapping)
                doLast {
                    adjustedMapping.parentFile.mkdirs()
                    adjustedMapping.text = baseMapping.getText('UTF-8') + aliases
                }
            }
            mapping = adjustedMapping
        }
        def remap = tasks.create("deobfDevMod${index}", SingleDeobfTask) {
            inJar = new DelayedFile(modJar)
            outJar = new DelayedFile(output)
            srg = new DelayedFile(mapping)
            addClasspath configurations.minecraft
            addClasspath configurations.minecraftDeps
            addClasspath files(localModJars, tasks.devJar.archivePath, jGui.tasks.jar.archivePath)
            dependsOn tasks.genSrgs, tasks.devJar, jGui.tasks.jar
            if (mappingTask != null) dependsOn mappingTask
            doFirst { remappedModsDirectory.mkdirs() }
        }
        client.dependsOn remap
        if (modJar == mixinProvider) mixinProviderOutput = output
        output
    }
    // Put the remapped jars on the initial LaunchWrapper classpath. Early
    // transformers may resolve their classes before --mods discovery occurs.
    // Keep UniMixins first when present, ahead of ReplayModTweaker and 0.7.
    def earlyModJars = mixinProviderOutput == null ? remappedModJars :
            [mixinProviderOutput] + remappedModJars.findAll { it != mixinProviderOutput }
    client.classpath = files(earlyModJars) +
            (mixinProviderOutput == null ? client.classpath : client.classpath - configurations.shade)
    client.args '--mods', runDirectory.toPath()
            .relativize(tasks.devJar.archivePath.canonicalFile.toPath()).toString()
    client.doFirst {
        // Only generated remaps are removed; the project-root devmods jars are untouched.
        if (remappedModsDirectory.isDirectory()) {
            def retainedOutputs = (remappedModJars + remappedModJars.collect {
                new File(it.path + '.md5')
            }).toSet()
            remappedModsDirectory.listFiles().findAll {
                it.isFile() && (it.name.endsWith('.jar.deobf.jar') ||
                        it.name.endsWith('.jar.deobf.jar.md5')) && !retainedOutputs.contains(it)
            }.each {
                if (!it.delete()) throw new GradleException("Unable to remove stale development mod copy: $it")
            }
        }
        def launchArgs = new ArrayList(client.args)
        def modsArgument = launchArgs.indexOf('--mods') + 1
        // Forge scans classpath jars for mods. Adding them through --mods too
        // duplicates their @Mod classes after early coremod discovery.
        def modPaths = [tasks.devJar.archivePath]
                .collect { runDirectory.toPath().relativize(it.canonicalFile.toPath()).toString() }
        if (modPaths.any { it.contains(',') }) {
            throw new GradleException("Forge 1.7.10's --mods argument cannot load a jar whose path contains a comma")
        }
        launchArgs[modsArgument] = modPaths.join(',')
        client.setArgs(launchArgs)
    }
    tasks.reobf.obfOutput.all { artifact ->
        artifact.getFile() // force resolve
        artifact.classpath += configurations.minecraft + configurations.minecraftDeps
    }
}

// Test sources aren't preprocessed.
tasks.compileTestJava.onlyIf { false }

File configureRelocationOutput = new File(project.buildDir, 'configureRelocation')
task configureRelocation() {
    dependsOn tasks.jar
    dependsOn configurations.shadow
    outputs.file(configureRelocationOutput)
    doLast {
        def pkgs = files(configurations.shadow).filter { it.exists() }.collect {
            def tree = it.isDirectory() ? fileTree(it) : zipTree(it)
            def pkgs = [].toSet()
            tree.visit { file ->
                if (!file.directory && file.name.endsWith('.class') && file.path.contains('/')) {
                    def pkg = file.path.substring(0, file.path.lastIndexOf('/')) + '/'
                    if (pkg.startsWith('com/')) {
                        if (pkg.startsWith('com/google/')) {
                            if (!pkg.startsWith('com/google/common')) {
                                pkgs << pkg.substring(0, pkg.indexOf('/', 'com/google/'.length()))
                            }
                        } else if (!pkg.startsWith('com/replaymod')) {
                            pkgs << pkg.substring(0, pkg.indexOf('/', 4))
                        }
                    } else if (pkg.startsWith('net/')) {
                        if (!pkg.startsWith('net/minecraft')) {
                            pkgs << pkg.substring(0, pkg.indexOf('/', 'net/'.length()))
                        }
                    } else if (pkg.startsWith('org/')) {
                        if (pkg.startsWith('org/apache/')) {
                            if (pkg.startsWith('org/apache/commons/')) {
                                if (!pkg.startsWith('org/apache/commons/io')) {
                                    pkgs << pkg.substring(0, pkg.indexOf('/', 'org/apache/commons/'.length()))
                                }
                            } else if (!pkg.startsWith('org/apache/logging')) {
                                pkgs << pkg.substring(0, pkg.indexOf('/', 'org/apache/'.length()))
                            }
                        } else if (pkg.startsWith('org/lwjgl')) {
                            return // either bundled with MC or uses natives which we can't relocate
                        } else if (!pkg.startsWith('org/spongepowered')) {
                            pkgs << pkg.substring(0, pkg.indexOf('/', 4))
                        }
                    } else if (!pkg.startsWith('javax/')) {
                        // Note: we cannot just use top level packages as those will be too generic and we'll run
                        // into this long standing bug: https://github.com/johnrengelman/shadow/issues/232
                        def i = pkg.indexOf('/')
                        def i2 = pkg.indexOf('/', i + 1)
                        if (i2 > 0) {
                            pkgs << pkg.substring(0, i2)
                        }
                    }
                }
            }
            pkgs
        }.flatten().unique()
        configureRelocationOutput.write(pkgs.join('\n'))
    }
}

tasks.removeByName('shadowJar') // we want to base our shadowed jar on the reobfJar output, not the sourceSet output
task shadowJar(type: com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar) {
    from { tasks.jar.archiveFile.get() }
    dependsOn tasks.reobf

    from({ zipTree(jGui.tasks.jar.archiveFile.get()) }) {
        filesMatching('mixins.jgui.json') {
            filter { it.replace('de.johni0702', 'com.replaymod.lib.de.johni0702') }
        }
        filesMatching('mixins.jgui.refmap.json') {
            filter { it.replace('de/johni0702', 'com/replaymod/lib/de/johni0702') }
        }
    }
    dependsOn jGui.tasks.reobf
    relocate 'de.johni0702', 'com.replaymod.lib.de.johni0702'

    manifest.inheritFrom tasks.jar.manifest

    from project.configurations.shade
    configurations = [project.configurations.shadow]
    exclude 'META-INF/INDEX.LIST', 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'module-info.class'

    dependsOn tasks.configureRelocation
    inputs.file(configureRelocationOutput)
    doFirst {
        configureRelocationOutput.readLines().each { pkg ->
            def pkgName = pkg.replace('/', '.')
            relocate pkgName, 'com.replaymod.lib.' + pkgName
        }
    }

    minimize {
        exclude(dependency('.*spongepowered:mixin:.*'))
    }
}
tasks.assemble.dependsOn tasks.shadowJar

jar {
    classifier = 'raw'

    from files(project.mixinRefMap.canonicalPath)
    manifest {
        attributes 'TweakClass': 'com.replaymod.core.tweaker.ReplayModTweaker',
                'TweakOrder': '0',
                'FMLCorePluginContainsFMLMod': 'true',
                'FMLCorePlugin': 'com.replaymod.core.LoadingPlugin',
                'FMLAT': 'replaymod_at.cfg'
    }
}

// A development mod candidate without the release jar's coremod manifest.
// Forge's --mods scan can then discover its @Mod classes exactly once.
task devJar(type: Jar, dependsOn: classes) {
    classifier = 'dev'
    from sourceSets.main.output
    from files(project.mixinRefMap.canonicalPath)
}

processResources {
    // this will ensure that this task is redone when the versions change.
    inputs.property 'version', { project.version }
    inputs.property 'mcversion', { mcVersionStr }

    filesMatching('mcmod.info') {
        // replace version and mcversion
        expand 'version': project.version, 'mcversion': mcVersionStr
    }

    // strip comments from (strict) JSON files
    filesMatching('pack.mcmeta') {
        filter { line -> line.trim().startsWith('//') ? '' : line}
    }

    exclude 'fabric.mod.json'
}

sourceSets {
    integrationTest {
        compileClasspath += main.runtimeClasspath + main.output
        java {
            srcDir file('src/integration-test/java')
        }
        resources.srcDir file('src/integration-test/resources')
    }
}

task copySrg(type: Copy, dependsOn: 'genSrgs') {
    from {project.tasks.genSrgs.mcpToSrg}
    into 'build'
}
compileJava.dependsOn copySrg

reobf.addExtraSrgFile project.mixinSrg



task runIntegrationTest(type: JavaExec, dependsOn: ["makeStart", "jar"]) {
    main = 'GradleStart'
    standardOutput = System.out
    errorOutput = System.err
    workingDir file(minecraft.runDir)

    def testDir = new File(minecraft.runDir, "integration-test")
    doFirst {
        testDir.deleteDir()
        testDir.mkdirs()
    }

    doLast {
        testDir.deleteDir()
    }

    afterEvaluate {
        def runClient = tasks.getByName("runClient")
        runIntegrationTest.jvmArgs = runClient.jvmArgs + "-Dfml.noGrab=true"
        runIntegrationTest.args = runClient.args + "--gameDir" + testDir.canonicalPath
        runIntegrationTest.classpath runClient.classpath + sourceSets.integrationTest.output
    }
}

defaultTasks 'build'
